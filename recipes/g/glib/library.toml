title = "glib"
version = "2.82.5"
description = "GLib is the core library of GTK+ and GNOME. It provides data structure handling, type casting, string utilities, file utilities, main loop, and other fundamental functionality used by most GNOME applications."
license = "LGPL-2.1"
canonical_name = "glib"
recipe_url = "https://download.gnome.org/sources/glib/2.82/glib-2.82.5.tar.xz"
output_type = "library"
libname = ["glib-2.0", "gobject-2.0", "gio-2.0"]
include_dir = "include/glib-2.0"
notes = "Also add -I$PREFIX/lib/glib-2.0/include, where glibconfig.h is installed."
[dependencies]
pcre2 = ""
zlib = ""
libffi = ""

[build-dependencies]
meson = ""
ninja = ""
pkg-config = ""
