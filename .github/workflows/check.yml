name: Check recipes

# pull_request covers branch pushes that open a PR. The push trigger was
# dropped because branches-ignore + pull_request ran the same checks twice for
# the same commit.
on: pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check recipes
        run: make checks
